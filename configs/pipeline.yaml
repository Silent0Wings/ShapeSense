# Pipeline contract — frozen by Stage 1. Changes after the freeze
# require team agreement (a PR the other owners review).
# Every experimental number lives here; no stage hard-codes one.

seed_set: [0, 1, 2]        # 3-5 seeds; the SAME set is used for every arm
image_size: 64             # square, pixels
image_channels: 1          # grayscale, black outline on white
synthetic_fraction: 0.3    # share of each Stage 4 training batch from Stage 3

# Decision 1. Frozen once the gemstone review is done. false = dry run
# until configs/gemstone_ids.csv has been filled by the reviewers.
filter_gemstones: false

# CRISP-DM iteration 1 (2026-11-08, Decision 1 amendment): (source, class)
# pairs excluded before the split. Quick, Draw! "diamonds" are mostly gemstone /
# cone / shield doodles, not rhombi (evidence: docs/crisp_dm/).
exclude_source_labels:
  - [quickdraw, diamond]

split:
  ratios: [0.70, 0.15, 0.15]
  group_by: phash          # near-duplicate groups never straddle splits
  phash_hamming_max: 2     # bits; Decision 15, grouped over ALL sources
  seed: 42                 # split assignment seed (Phase 1 used 42)

paths:
  catalog: data_set/unified/catalog.sqlite
  metadata: data_set/unified/metadata.csv
  unified_dir: data_set/unified
  raw_dir: data_set
  taxonomy: configs/taxonomy.yaml
  gemstone_ids: configs/gemstone_ids.csv
  splits_dir: configs/splits
  artifacts_dir: artifacts
  test_access_log: artifacts/test_access.log

# Registered module names Stage 4 looks up in src/common/registry.
modules:
  augment: augment
  synthetic: synthetic

# The three arms; identical training, only the data stream differs.
arms:
  A0: { augment: false, synthetic: false }   # report's "Model A" (control)
  A1: { augment: true,  synthetic: false }   # isolates augmentation effect
  B:  { augment: true,  synthetic: true }    # report's "Model B"

# One entry per trained CNN (arm x seed). Only arm and seed may vary;
# every training setting comes from `train`. Ablations are new entries.
runs:
  - { arm: A0, seed: 0 }
  - { arm: A0, seed: 1 }
  - { arm: A0, seed: 2 }
  - { arm: A1, seed: 0 }
  - { arm: A1, seed: 1 }
  - { arm: A1, seed: 2 }
  - { arm: B,  seed: 0 }
  - { arm: B,  seed: 1 }
  - { arm: B,  seed: 2 }

# Stage 2 augmentation ranges (train side only). Shear and non-uniform
# scale are skipped for taxonomy.no_shear_no_nonuniform_scale classes.
augment:
  rotate_deg: 180            # +/- degrees; any rotation is label-safe
  scale: [0.85, 1.0]         # uniform scale jitter relative to the standardized size
  frame_margin: 0.08         # = standardize.MARGIN: output is re-framed like Stage 1 (P-55)
  nonuniform_scale: 0.10     # +/- extra per-axis factor (allowed classes only)
  shear_deg: 12              # +/- degrees (allowed classes only)
  translate_px: 3            # +/- pixels, kept inside the frame
  noise_p: 0.3               # probability of salt noise
  noise_fraction: 0.004      # share of pixels flipped when noise applies
  blur_p: 0.3                # probability of Gaussian blur
  blur_sigma: [0.4, 0.8]     # pixels; output is re-thresholded to 0/255
  ink_threshold: 128         # grey level below which a pixel counts as ink

# Stage 3 synthetic generator parameter ranges (margins live in taxonomy).
synth:
  radius_px: [16, 28]        # half the shape's extent before rotation
  stroke_px: 2               # matches the standardized 2-px outline
  center_jitter_px: 4        # +/- pixels
  ellipse_max_axis_ratio: 2.5
  rectangle_max_side_ratio: 3.0
  diamond_acute_angle_deg: [40, 80]   # interior acute angle range
  star_inner_ratio: [0.35, 0.6]       # inner / outer radius
  vertex_jitter_px: 1.0      # +/- pixels per polygon vertex (domain gap)
  supersample: 2             # render at 2x then downsample + threshold (4x missed
                             # the 2,000 img/s target of stages/stage_3.md R8)

# Stage 4 training (Decision 8 defaults, Decision 7 tuning, Decision 13).
train:
  channels: [32, 64, 128, 128]   # 4 blocks: 46-px receptive field (P-54; Decision 8 had 3)
  dropout: 0.2               # replaced by the Decision 7 grid winner
  lr: 0.001                  # replaced by the Decision 7 grid winner
                             # Decision 7 winner (artifacts/stage4/tuning.json, A1 seed 0,
                             # validation macro-F1 90.44, RTX 3080): lr 0.003, dropout 0.2
  weight_decay: 0.0001
  optimizer: adamw
  schedule: cosine
  batch_size: 256
  max_epochs: 30
  early_stopping_patience: 5
  selection_metric: val_macro_f1
  steps_per_epoch: 49        # Decision 13: frozen from arm A0 = ceil(12405 train / 256);
                             # re-frozen after CRISP-DM iteration 1 (was 50)
  tuned: false               # true once the Decision 7 winner is frozen
  device: cuda               # auto | cpu | cuda; cuda fails loudly when no GPU is visible
  num_threads: 2             # torch CPU threads per run (scales sublinearly)
  parallel_runs: 2           # independent runs trained at once; 8 GB RTX 3080 Laptop:
                             # the parent keeps GPU memory after the benchmark, so 3 workers
                             # (4 GPU processes) filled the VRAM and stalled (2026-11-08);
                             # each run stays deterministic from (arm, seed)
  tuning:
    arm: A1
    lr: [0.0003, 0.001, 0.003]
    dropout: [0.2, 0.4]
  baselines:
    per_class: 600           # class-balanced real images per class
    logreg_C: [0.01, 0.1, 1.0]
    svm_C: [0.01, 0.1, 1.0]
    hog_pixels_per_cell: 8
  benchmark_batches: 100

# Stage 5 evaluation (Decisions 9, 10, 12, 14).
evaluation:
  alpha: 0.05
  n_boot: 2000
  bootstrap_seed: 0
  shortcut_trigger_points: 10        # Decision 12
  power_halfwidth_limit_points: 1.0  # Decision 10 power check
  noise_band_accuracy: 0.9           # band = 100*sqrt(p(1-p)/n)
  confusion_pairs:
    - [square, diamond]
    - [square, rectangle]
    - [circle, ellipse]

# Locked in advance (implementation.md, decision 3). B beats A1 if met.
success_criterion:
  macro_f1_min_gain_points: 1.0   # B vs A1
  ci_level: 0.95                  # bootstrap CI must exclude 0
  max_class_f1_drop_points: 2.0   # no class may drop more than this
